<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Log in</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="card">
		<h1>Welcome back</h1>
		<p class="intro">Log in to keep planning your rooms.</p>

		<form action="/login" method="POST">
			<label for="username">Username</label>
			<input type="text" name="username" id="username" required>

			<label for="password">Password</label>
			<input type="password" name="password" id="password" required>

			<button type="submit">Log in</button>
		</form>

		<p class="switch">New here? <a href="register.html">Create an account</a></p>
	</main>
</body>
</html>
