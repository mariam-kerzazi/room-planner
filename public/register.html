<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create an account</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="card">
		<h1>Create an account</h1>
		<p class="intro">Save furniture and decor ideas, then plan your rooms before you buy anything.</p>

		<form action="/register" method="POST">
			<label for="username">Username</label>
			<input type="text" name="username" id="username" maxlength="50" required>

			<label for="email">E-mail</label>
			<input type="email" name="email" id="email" maxlength="100" required>

			<label for="password">Password</label>
			<input type="password" name="password" id="password" required>

			<button type="submit">Create account</button>
		</form>

		<p class="switch">Already have an account? <a href="login.html">Log in</a></p>
	</main>
</body>
</html>
